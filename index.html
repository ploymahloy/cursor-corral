<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Cursor Corral</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
			}

			#canvas {
				display: block;
				width: 100vw;
				height: 100vh;
				cursor:
					url('assets/png/lasso.png') 16 16,
					pointer;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>
	</body>
</html>

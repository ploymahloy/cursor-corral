<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Cursor Corral</title>
		<style>
			html,
			body {
				margin: 0;
				overflow: hidden;
				width: 100%;
				height: 100dvh;
				height: 100vh;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				background-color: green;
			}

			.overlay {
				position: fixed;
				inset: 0;
				z-index: 10;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				background: transparent;
			}

			.overlay.hidden {
				display: none;
			}

			.game-dialog {
				max-width: 28rem;
				padding: 1.75rem 2rem;
				border-radius: 0.75rem;
				background: #f5e6c8;
				color: #2a1f0f;
				box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.35);
				text-align: center;
			}

			.dialog-message {
				margin: 0 0 1.5rem;
				font-family: system-ui, sans-serif;
				font-size: 1.05rem;
				line-height: 1.5;
			}

			.dialog-button {
				padding: 0.65rem 2rem;
				border: none;
				border-radius: 0.5rem;
				background: #3d6b2e;
				color: #fff;
				font-family: system-ui, sans-serif;
				font-size: 1.1rem;
				font-weight: 600;
				cursor: pointer;
			}

			.dialog-button:hover {
				background: #4a7f38;
			}
		</style>
	</head>
	<body>
		<div id="start-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="start-message">
			<div class="game-dialog">
				<p id="start-message" class="dialog-message">
					Thank you for playing Cursor Corral! Please allow ads so that I can afford to build more silly games like
					this. Enjoy!
				</p>
				<button id="play-button" class="dialog-button" type="button" autofocus>Play</button>
			</div>
		</div>
		<div id="win-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="win-message">
			<div class="game-dialog">
				<p id="win-message" class="dialog-message">Congrats!</p>
				<button id="play-again-button" class="dialog-button" type="button">Play again</button>
			</div>
		</div>
		<canvas id="canvas"></canvas>
		<script src="game.js"></script>
	</body>
</html>
